name: Old Games Fixes website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'Emergency4/comparison/**'
      - 'Emergency4/screenshots/**'
      - '.github/workflows/emergency4-comparison-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: emergency4-comparison-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare website and comparison
        run: |
          mkdir -p _site/emergency4 _site/screenshots
          cp -R site/. _site/
          cp Emergency4/comparison/index.html _site/emergency4/index.html
          cp Emergency4/screenshots/* _site/screenshots/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

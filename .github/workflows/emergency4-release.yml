name: Emergency 4 release

on:
  push:
    branches: [main]
    paths:
      - 'Emergency4/src/**'
      - 'Emergency4/build-release.ps1'
      - 'Emergency4/README*.md'
      - 'Emergency4/CHANGELOG.md'
      - 'Emergency4/docs/**'
      - '.github/workflows/emergency4-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emergency4-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate and build the distributable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('Emergency4/src/Emergency4-Fix.ps1', 'Emergency4/build-release.ps1')) {
            $tokens = $null; $errors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          $report = Get-Content Emergency4/docs/validation.json -Raw | ConvertFrom-Json
          if ($report.status -ne 'PASS') { throw 'The local validation report is not passing.' }
          & ./Emergency4/build-release.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Release build failed.' }

      - name: Publish versioned beta with ZIP and SHA-256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Get-Content Emergency4/src/Emergency4-Fix.ps1 -Raw
          $match = [regex]::Match($script, '(?m)^\$version\s*=\s*''([^'']+)''')
          if (!$match.Success) { throw 'Version not found.' }
          $version = $match.Groups[1].Value
          $tag = 'emergency4-v' + $version
          $zip = 'Emergency4/release/Emergency4-ResolutionFix-v' + $version + '.zip'
          $sums = 'Emergency4/release/SHA256SUMS.txt'
          if (!(Test-Path -LiteralPath $zip)) { throw 'Versioned ZIP not found.' }
          $expected = ((Get-Content $sums -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $expected) { throw 'ZIP checksum mismatch.' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; keeping its existing tag and assets."
            exit 0
          }
          $arguments = @('release','create',$tag,$zip,$sums,'--repo',$env:GITHUB_REPOSITORY,
            '--target',$env:GITHUB_SHA,'--title',"Emergency 4 Resolution & Aspect Ratio Fix $version",
            '--notes-file','Emergency4/docs/RELEASE-NOTES.it.md')
          if ($version.Contains('-')) { $arguments += @('--prerelease','--latest=false') }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json url,tagName,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { throw 'Release verification failed.' }

name: Emergency 4 release

on:
  push:
    branches: [main]
    paths:
      - 'Emergency4/src/**'
      - 'Emergency4/asi/**'
      - 'Emergency4/build-asi-release.ps1'
      - 'Emergency4/build-release.ps1'
      - 'Emergency4/README*.md'
      - 'Emergency4/CHANGELOG.md'
      - 'Emergency4/docs/**'
      - '.github/workflows/emergency4-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emergency4-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate and build the distributable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Get-Content Emergency4/docs/validation-asi.json -Raw | ConvertFrom-Json
          if ($report.status -ne 'PASS') { throw 'The local ASI validation report is not passing.' }
          # Use the same pinned x86 toolchain as the native private-fixture tests.
          $tools = Join-Path $env:RUNNER_TEMP 'emergency4-toolchain'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $archive = Join-Path $tools 'w64devkit-x86.7z.exe'
          Invoke-WebRequest -Uri 'https://github.com/skeeto/w64devkit/releases/download/v2.10.1/w64devkit-x86-2.10.1.7z.exe' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '8821e6e4aa42d7eb42bf0cbabd18c4175fb0422bf96f4a178e1530b4ca69c73f') { throw 'Compiler archive checksum mismatch.' }
          & 7z x $archive "-o$tools" -y -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { throw 'Compiler extraction failed.' }
          & ./Emergency4/build-asi-release.ps1 -Compiler (Join-Path $tools 'w64devkit/bin/g++.exe')
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'ASI build failed.' }

      - name: Publish game release page with ZIP and SHA-256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content Emergency4/asi/VERSION -Raw).Trim()
          $tag = 'emergency4'
          $versionTag = 'emergency4-v' + $version
          $zip = 'Emergency4/release/Emergency4.WidescreenFix-v' + $version + '.zip'
          $sums = 'Emergency4/release/SHA256SUMS.txt'
          if (!(Test-Path -LiteralPath $zip)) { throw 'Versioned ZIP not found.' }
          $expected = ((Get-Content $sums -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $expected) { throw 'ZIP checksum mismatch.' }
          # Keep one download page per game; retain versioned tags as source history.
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f "sha=$env:GITHUB_SHA" -F force=false
          } else {
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:GITHUB_SHA"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not update the game release tag.' }
          $title = "Emergency 4 Widescreen Fix ASI $version"
          $releaseExists = $false
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { $releaseExists = $true }
          if (!$releaseExists) {
            gh release view $versionTag --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release edit $versionTag --repo $env:GITHUB_REPOSITORY --tag $tag
              if ($LASTEXITCODE -ne 0) { throw 'Could not migrate the existing release page.' }
              $releaseExists = $true
            }
          }
          if ($releaseExists) {
            $arguments = @('release','edit',$tag,'--repo',$env:GITHUB_REPOSITORY,'--title',$title,
              '--notes-file','Emergency4/docs/RELEASE-NOTES.md')
            if ($version.Contains('-')) { $arguments += @('--prerelease=true','--latest=false') }
            else { $arguments += '--prerelease=false' }
            & gh @arguments
            if ($LASTEXITCODE -ne 0) { throw 'Release description update failed.' }
            gh release upload $tag $zip $sums --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release asset update failed.' }
          } else {
            $arguments = @('release','create',$tag,$zip,$sums,'--repo',$env:GITHUB_REPOSITORY,
              '--target',$env:GITHUB_SHA,'--title',$title,'--notes-file','Emergency4/docs/RELEASE-NOTES.md')
            if ($version.Contains('-')) { $arguments += @('--prerelease','--latest=false') }
            & gh @arguments
            if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json url,tagName,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { throw 'Release verification failed.' }
          # Withdraw the earlier package containing non-English scripts/docs without deleting its history.
          $legacyTag = 'emergency4-v1.0.0-beta.1'
          gh release view $legacyTag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $legacyTag --repo $env:GITHUB_REPOSITORY --draft --latest=false --notes-file Emergency4/docs/LEGACY-RELEASE.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not withdraw the superseded non-English package.' }
          }
          Write-Host 'Release publication completed.'
          $global:LASTEXITCODE = 0

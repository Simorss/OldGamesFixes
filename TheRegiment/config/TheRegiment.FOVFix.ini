[Main]
; Enable the entire fix: 1 = on, 0 = off.
; Restart the game after editing this file.
Enabled = 1
; Configuration format. Leave this value unchanged.
ConfigVersion = 3

[Mouse]
; Enable the mouse corrections below: 1 = on, 0 = original game behavior.
Enabled = 1
; 1 = remove mouse acceleration, 0 = keep the game's acceleration.
DisableAcceleration = 1
; 1 = remove mouse smoothing, 0 = keep the game's smoothing.
DisableSmoothing = 1

[FOV]
; Camera FOV in horizontal degrees at 4:3. Range: 30 to 110.
BaseFOV = 70.000
; 1 = expand the horizontal view on wider screens, preserving vertical framing.
; 0 = use the manual FOV without aspect-ratio compensation.
HorPlus = 1
; Reference degrees per key press. Range: 0.1 to 10.
Step = 1.000
; 1 = remember hotkey adjustments, 0 = keep them for this session only.
SaveFOV = 1

[Viewmodel]
; Apply a separate FOV to first-person weapons and hands: 1 = on, 0 = off.
Enabled = 1
; Viewmodel FOV in horizontal degrees at 4:3. Range: 20 to 140.
BaseFOV = 70.000
; 1 = compensate for screen aspect ratio, 0 = use only the manual FOV.
HorPlus = 1
; Reference degrees per key press. Range: 0.1 to 10.
Step = 1.000
; 1 = remember hotkey adjustments, 0 = keep them for this session only.
SaveFOV = 1

[Keys]
; Use four different keys that are free in your game bindings.
; Accepted values: F1-F24, Comma, Period, or a decimal/hex Windows VK code.
CameraDecrease = F7
CameraIncrease = F8
ViewmodelDecrease = F11
ViewmodelIncrease = F12

[OSD]
; Show the current FOV after a hotkey adjustment or a resolution change.
; Display time in milliseconds: 2200 = 2.2 seconds, 0 = hidden. Maximum: 10000.
DurationMs = 2200

; Emergency 4 Widescreen Fix ASI
; Close and restart the game after changing these options.
[MAIN]
; 1 = enable the plugin; 0 = leave game memory unchanged.
Enabled = 1

; Set BOTH values to 0 to use the desktop resolution of the monitor under
; the mouse pointer when the game starts. Set BOTH for a custom resolution.
ResX = 0
ResY = 0

; 1 = windowed mode; 0 = fullscreen mode. Restart the game after changing it.
Windowed = 0

; 1 = fit and center the original menu/HUD without distortion.
; 0 = stretch the menu/HUD to fill the screen.
; Gameplay fills the display and receives FOV correction in both modes.
KeepUIAspectRatio = 1

; 0 = preserve the focal parameter read from the game's configuration, with
; automatic aspect correction. Recognized earlier patches are accounted for.
; Set a positive integer to override it. This is NOT an angle in degrees.
; A higher value narrows the view; a lower value widens it.
; A positive value overrides the game's r_fov value using this 4:3 baseline.
BaseFOV = 0

